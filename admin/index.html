      const stored = localStorage.getItem("movie_comments");

          return initialComments;
        }

          ...comment,
          movieTitle: comment.movieTitle || comment.movie || "Phim chưa xác định",
          createdAt: comment.createdAt || Date.now() - index * 60000
        })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      } catch (error) {
        return initialComments;
      }

    // --- TRAFFICCHART COMPONENT ---
    function TrafficChart({ data }) {
      const [hoveredIdx, setHoveredIdx] = useState(null);

      const width = 600;
      const height = 240;
      const paddingLeft = 45;
      const paddingRight = 20;
      const paddingTop = 20;
      const paddingBottom = 30;

      const chartWidth = width - paddingLeft - paddingRight;
      const chartHeight = height - paddingTop - paddingBottom;
      const maxVal = 20000;

      const getX = (index) => paddingLeft + (index / (data.length - 1)) * chartWidth;
      const getY = (val) => height - paddingBottom - (val / maxVal) * chartHeight;

      const regPath = `M ${data.map((d, i) => `${getX(i)} ${getY(d.registered)}`).join(' L ')}`;
      const guestPath = `M ${data.map((d, i) => `${getX(i)} ${getY(d.guest)}`).join(' L ')}`;

      const regAreaPath = `${regPath} L ${getX(data.length - 1)} ${height - paddingBottom} L ${getX(0)} ${height - paddingBottom} Z`;

    function UserManagement({ users, setUsers }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [filterType, setFilterType] = useState('All');
      const [editingUserId, setEditingUserId] = useState(null);
      const [editName, setEditName] = useState('');

      const handleToggleBlock = (userId) => {
        setUsers(prevUsers => 
          prevUsers.map(user => 
            user.id === userId ? { ...user, status: user.status === 'Blocked' ? 'Active' : 'Blocked' } : user
          )
        );
      };

      const handleStartEdit = (user) => {
        setEditingUserId(user.id);
        setEditName(user.name);
      };

      const handleSaveEdit = (userId) => {
        if (!editName.trim()) return;
        setUsers(prevUsers => 
          prevUsers.map(user => user.id === userId ? { ...user, name: editName } : user)
        );
        setEditingUserId(null);
      };

      const filteredUsers = useMemo(() => {
        return users.filter((user) => {
          const matchesSearch = 
            user.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
            user.id.toLowerCase().includes(searchQuery.toLowerCase()) || 
            user.email.toLowerCase().includes(searchQuery.toLowerCase()) || 
            user.status.toLowerCase().includes(searchQuery.toLowerCase());
            
          const matchesType = 
            filterType === 'All' || 
            (filterType === 'Registered' && user.type === 'Registered') ||
            (filterType === 'Guest' && user.type === 'Guest');
            
          return matchesSearch && matchesType;
        });
      }, [users, searchQuery, filterType]);

      return (
        <div className="glass-panel p-6 rounded-2xl space-y-6">
          <div className="flex flex-col md:flex-row gap-4 items-center justify-between border-b border-[#1f1f2e] pb-6">

              <div className="relative flex-grow md:flex-grow-0 md:w-72">
                <input
                  type="text"
                  placeholder="Tìm theo tên, email, ID..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-[#0a0a0c] border border-[#1f1f2e] text-xs text-white rounded-xl pl-9 pr-4 py-2.5 outline-none focus:border-brand transition-colors"
                />
                <Icon name="search" className="absolute left-3 top-3.5 text-gray-400" size={14} />
              </div>

              <div className="flex bg-[#0a0a0c] p-1 rounded-xl border border-[#1f1f2e] text-xs">

                  <button

                      filterType === type ? 'bg-brand text-white shadow-md glow-red' : 'text-gray-400 hover:text-white'

                  >
                    {type === 'All' ? 'Tất cả' : type === 'Registered' ? 'Thành viên' : 'Khách'}

                ))}

          </div>

          <div className="overflow-x-auto w-full">

                <tr className="border-b border-[#1f1f2e] text-[11px] text-gray-400 font-bold uppercase tracking-wider">

                  <th className="py-4 px-4 text-right">Hành Động</th>
                </tr>
              </thead>
              <tbody className="text-xs divide-y divide-[#1f1f2e]/40">
                {filteredUsers.length > 0 ? (
                  filteredUsers.map((user) => (
                    <tr 
                      key={user.id} 
                      className={`hover:bg-[#121216]/30 transition-colors ${
                        user.status === 'Blocked' ? 'opacity-60 bg-red-950/5' : ''
                      }`}
                    >
                      <td className="py-4 px-4 font-mono text-gray-400 text-[10px]">{user.id}</td>
                      <td className="py-4 px-4">
                        <div className="flex items-center gap-3">
                          <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs border ${
                            user.type === 'Registered' ? 'bg-brand/10 border-brand/20 text-brand' : 'bg-cyan-500/10 border-cyan-500/20 text-cyan-400'
                          }`}>
                            <Icon name={user.type === 'Registered' ? 'user' : 'globe'} size={13} />
                          </div>
                          <div>
                            {editingUserId === user.id ? (
                              <div className="flex items-center gap-1.5 mt-0.5">

                                  type="text" 
                                  value={editName}
                                  onChange={(e) => setEditName(e.target.value)}
                                  className="bg-dark-bg border border-[#1f1f2e] text-white text-xs px-2 py-0.5 rounded outline-none focus:border-brand"
                                />
                                <button 
                                  onClick={() => handleSaveEdit(user.id)}
                                  className="p-1 bg-green-950/40 text-green-400 border border-green-500/20 rounded hover:bg-green-900/40 transition-colors"
                                >
                                  <Icon name="check" size={11} />

                          </div>
                        </div>
                      </td>
                      <td className="py-4 px-4">

                        }`}>
                          {user.type === 'Registered' ? 'Thành viên' : 'Khách vãng lai'}
                        </span>
                      </td>
                      <td className="py-4 px-4 text-gray-400 font-mono">{user.joinDate}</td>
                      <td className="py-4 px-4 font-semibold text-gray-200">{user.watchTime}</td>
                      <td className="py-4 px-4">
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                          user.status === 'Active' ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'
                        }`}>
                          {user.status === 'Active' ? 'Hoạt động' : 'Đã Khóa'}
                        </span>
                      </td>
                      <td className="py-4 px-4 text-right">
                        <div className="flex items-center justify-end gap-2">
                          <button
                            onClick={() => handleStartEdit(user)}
                            className="p-1.5 hover:bg-[#121216] border border-[#1f1f2e]/40 hover:border-[#1f1f2e] text-gray-400 hover:text-white rounded-lg transition-all"
                            title="Đổi tên hiển thị"
                          >
                            <Icon name="edit-3" size={12} />
                          </button>
                          <button
                            onClick={() => handleToggleBlock(user.id)}
                            className={`p-1.5 border rounded-lg transition-all ${
                              user.status === 'Blocked' 
                                ? 'bg-green-950/20 border-green-500/30 text-green-400 hover:bg-green-900/30' 
                                : 'bg-red-950/20 border-red-500/30 text-red-400 hover:bg-red-900/30'
                            }`}
                            title={user.status === 'Blocked' ? 'Mở khóa tài khoản' : 'Khóa tài khoản'}
                          >
                            <Icon name={user.status === 'Blocked' ? 'shield' : 'shield-off'} size={12} />
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))

                  <tr>
                    <td colSpan="7" className="py-8 text-center text-gray-400">
                      Không tìm thấy tài khoản tương ứng.
                    </td>
                  </tr>
                )}

            </table>
          </div>
        </div>

      const [cacheExpiry, setCacheExpiry] = useState("24");
      const [serverDefault, setServerDefault] = useState("vidsrc.pro");
      const [maintenanceMode, setMaintenanceMode] = useState(false);

      // Fetch dynamic movie list from TMDB API
      useEffect(() => {
        let isMounted = true;
        async function fetchMoviesFromApi() {
          setLoadingMovies(true);
          try {
            // Fetch genre details
            const genreRes = await fetch(`https://api.themoviedb.org/3/genre/movie/list?api_key=${apiKey}&language=vi-VN`);
            const genreData = await genreRes.json();
            const genreMap = {};
            if (genreData && genreData.genres) {
              genreData.genres.forEach(g => {
                genreMap[g.id] = g.name;
              });
            }

            // Fetch popular and top rated movies
            const [popRes, topRes] = await Promise.all([
              fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${apiKey}&language=vi-VN&page=1`),
              fetch(`https://api.themoviedb.org/3/movie/top_rated?api_key=${apiKey}&language=vi-VN&page=1`)
            ]);
            
            const popData = await popRes.json();
            const topData = await topRes.json();

            if (!popData.results || !topData.results) {
              throw new Error("Không lấy được kết quả từ TMDB API");
            }

            // Merge details
            const allFetched = [...popData.results, ...topData.results];
            const uniqueMap = {};
            allFetched.forEach(m => {
              uniqueMap[m.id] = m;
            });
            const uniqueList = Object.values(uniqueMap);

            // Sort by popularity descending
            const sortedByPopularity = uniqueList.sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
            
            // Map movies structure
            const mapped = sortedByPopularity.map(m => {
              const genreNames = (m.genre_ids || [])
                .map(id => genreMap[id])
                .filter(Boolean)
                .slice(0, 2)
                .join(" / ") || "Phim";

              const pop = m.popularity || 100;
              return {
                id: m.id,
                title: m.title || m.name,
                genre: genreNames,
                image: m.poster_path ? `https://image.tmdb.org/t/p/w185${m.poster_path}` : "https://images.unsplash.com/photo-1594909122845-11baa439b7bf?w=185&auto=format&fit=crop&q=60",
                views: {
                  week: Math.round(pop * 30 + Math.random() * 500),
                  month: Math.round(pop * 150 + Math.random() * 2000),
                  allTime: Math.round(pop * 800 + Math.random() * 10000)
                },
                rating: m.vote_average || 0.0
              };
            });

            if (isMounted) {
              setMovies(mapped);
            }
          } catch(err) {
            console.error("API error, using initialMovies fallback:", err);
            if (isMounted) {
              setMovies(initialMovies);
            }
          } finally {
            if (isMounted) {
              setLoadingMovies(false);
            }
          }
        }
        
        fetchMoviesFromApi();
        return () => { isMounted = false; };
      }, [apiKey]);

      const registeredCount = users.filter(u => u.type === 'Registered').length;
      const guestCount = users.filter(u => u.type === 'Guest').length;
      const activeCount = users.filter(u => u.status === 'Active').length;
      const blockedCount = users.filter(u => u.status === 'Blocked').length;
      const recentCommentCount = comments.filter(comment => (Date.now() - (comment.createdAt || 0)) <= 24 * 60 * 60 * 1000).length;
      const liveComments = [...comments].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 4);

      const handleDeleteComment = (commentId) => {
        const target = comments.find(comment => comment.id === commentId);
        if (!target) return;

        const confirmed = window.confirm(`Xóa bình luận của ${target.user} về ${target.movieTitle || target.movie}?`);
        if (!confirmed) return;

        setComments(prev => prev.filter(comment => comment.id !== commentId));
      };

      const handleSaveSettings = (e) => {
        e.preventDefault();
        alert("Cài đặt hệ thống đã được cập nhật thành công!");
      };

      return (
        <div className="min-h-screen bg-dark-bg text-dark-text flex">
          <Sidebar 
            activeTab={activeTab} 
            setActiveTab={setActiveTab} 
            sidebarOpen={sidebarOpen} 
            setSidebarOpen={setSidebarOpen} 
          />

          <div className="flex-1 flex flex-col min-w-0 lg:pl-64">
            <Header setSidebarOpen={setSidebarOpen} activeTab={activeTab} />

            <main className="flex-1 p-6 space-y-6 overflow-y-auto max-w-7xl mx-auto w-full animate-fade-in">
              
              {/* TAB: DASHBOARD */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6">
                  <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    <StatsCard 
                      title="Tổng lượt xem trang" 
                      value={systemStats.views.total.toLocaleString()} 
                      icon="eye" 
                      trend={`+${systemStats.views.growth}%`} 
                      trendDirection="up" 
                      trendLabel="so với tháng trước" 
                      color="brand"
                    />
                    <StatsCard 
                      title="Tổng bình luận / Đánh giá" 
                      value={comments.length.toLocaleString()} 
                      icon="message-square" 
                      trend={`${recentCommentCount} posts`} 
                      trendDirection="neutral" 
                      trendLabel="trong 24h qua" 
                      color="info"
                    />
                    <StatsCard 
                      title="Tỷ lệ tài khoản" 
                      value={`${registeredCount} / ${guestCount}`} 
                      icon="users" 
                      trend={`${((registeredCount / (registeredCount + guestCount)) * 100).toFixed(0)}% Mem`} 
                      trendDirection="info" 
                      trendLabel="Thành viên vs Khách truy cập" 
                      color="gray"
                    />
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-2">
                      <TrafficChart data={trafficTrendData} />
                    </div>

                    {/* Comments block */}
                    <div className="glass-panel p-6 rounded-2xl flex flex-col justify-between">
                      <div>
                        <h4 className="text-sm font-bold text-white tracking-wide border-b border-[#1f1f2e] pb-3 mb-4 flex items-center gap-2">
                          <Icon name="activity" className="text-brand animate-pulse" />
                          Hoạt Động Gần Đây
                        </h4>
                        
                        <div className="space-y-4 max-h-[260px] overflow-y-auto pr-1">
                          {liveComments.map((comment) => (
                            <div key={comment.id} className="p-3 bg-[#121216]/50 border border-[#1f1f2e]/40 rounded-xl space-y-1.5 hover:border-[#1f1f2e] transition-all">
                              <div className="flex items-center justify-between gap-2">
                                <div className="flex items-center gap-2 min-w-0">
                                  <span className="w-5 h-5 rounded-full bg-brand/10 text-brand flex items-center justify-center font-bold text-[9px] border border-brand/20">
                                    {comment.avatar}
                                  </span>
                                  <span className="text-[10px] font-bold text-white truncate max-w-[100px]">{comment.user}</span>
                                </div>
                                <div className="flex items-center gap-2 flex-shrink-0">
                                  <span className="text-[9px] text-gray-400 font-medium font-mono">{comment.time}</span>
                                  <button
                                    onClick={() => handleDeleteComment(comment.id)}
                                    className="text-[9px] px-2 py-1 rounded-lg bg-red-950/30 text-red-300 border border-red-500/20 hover:bg-red-950/50 transition-colors"
                                  >
                                    Xóa
                                  </button>
                                </div>
                              </div>
                              <p className="text-[10px] text-[#8c94a5] font-semibold truncate">
                                Phim: <span className="text-gray-300 italic">"{comment.movieTitle || comment.movie || 'Phim chưa xác định'}"</span>
                              </p>
                              <p className="text-[10px] text-gray-300 leading-normal line-clamp-2">
                                {comment.text}
                              </p>
                            </div>
                          ))}
                        </div>
                      </div>
                      <div className="pt-4 mt-4 border-t border-[#1f1f2e]/40 text-[10px] text-center text-gray-400">
                        Đồng bộ sự kiện: <span className="text-green-400 font-bold">ONLINE</span>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    {/* Top movie preview */}
                    <div className="glass-panel p-6 rounded-2xl space-y-4">
                      <div className="flex justify-between items-center border-b border-[#1f1f2e] pb-3">
                        <h4 className="text-xs font-bold text-white uppercase tracking-wider">Phim Hot Nhất Tuần</h4>
                        <button onClick={() => setActiveTab('movies')} className="text-[10px] text-brand font-bold hover:underline">Chi Tiết</button>
                      </div>
                      {movies.length > 0 ? (
                        <div className="flex items-center gap-4 bg-[#121216]/40 p-3 rounded-xl border border-[#1f1f2e] animate-fade-in">
                          <img src={movies[0].image} alt={movies[0].title} className="w-12 h-16 rounded object-cover border border-[#1f1f2e]" />
                          <div className="flex-grow">
                            <h5 className="text-xs font-bold text-white truncate max-w-[150px]">{movies[0].title}</h5>
                            <p className="text-[10px] text-gray-400 mt-0.5">{movies[0].genre}</p>
                            <span className="text-[9px] bg-brand/10 border border-brand/20 text-brand font-bold px-1.5 py-0.5 rounded mt-1.5 inline-block">Trending #1</span>
                          </div>
                          <div className="text-right">
                            <p className="text-xs font-mono font-bold text-white">{(movies[0].views.week).toLocaleString()} lượt</p>
                            <p className="text-[9px] text-yellow-500 font-semibold mt-1">★ {movies[0].rating.toFixed(1)} Điểm</p>
                          </div>
                        </div>
                      ) : (
                        <div className="h-16 flex items-center justify-center text-xs text-gray-400 bg-[#121216]/20 border border-[#1f1f2e] rounded-xl font-medium">
                          <span>Đang tải danh sách phim...</span>
                        </div>
                      )}
                    </div>

                    {/* DB Health Checks */}
                    <div className="glass-panel p-6 rounded-2xl space-y-4">
                      <div className="flex justify-between items-center border-b border-[#1f1f2e] pb-3">
                        <h4 className="text-xs font-bold text-white uppercase tracking-wider">Trạng Thái Hệ Thống</h4>
                        <span className="text-[9px] text-green-400 font-mono">Tự động đồng bộ: live</span>
                      </div>
                      <div className="grid grid-cols-3 gap-3 text-center">
                        <div className="bg-[#121216]/40 p-3 rounded-xl border border-[#1f1f2e]">
                          <span className="text-[9px] text-gray-400 block font-semibold">ONLINE USERS</span>
                          <span className="text-base font-bold text-green-400 mt-1 block font-mono">{activeCount}</span>
                        </div>
                        <div className="bg-[#121216]/40 p-3 rounded-xl border border-[#1f1f2e]">
                          <span className="text-[9px] text-gray-400 block font-semibold">TÀI KHOẢN KHÓA</span>
                          <span className="text-base font-bold text-red-400 mt-1 block font-mono">{blockedCount}</span>
                        </div>
                        <div className="bg-[#121216]/40 p-3 rounded-xl border border-[#1f1f2e]">
                          <span className="text-[9px] text-gray-400 block font-semibold font-mono">PHIM ĐƯỢC LỌC</span>
                          <span className="text-base font-bold text-white mt-1 block font-mono">{movies.length}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB: MOVIES */}
              {activeTab === 'movies' && (
                loadingMovies ? (
                  <div className="flex flex-col items-center justify-center py-20 text-gray-400 gap-4">
                    <Icon name="loader" className="animate-spin text-brand" size={40} />
                    <p className="text-sm font-semibold">Đang nạp dữ liệu phim từ TMDB API...</p>
                  </div>
                ) : (
                  <MovieAnalytics movies={movies} />
                )
              )}

              {/* TAB: USERS */}
              {activeTab === 'users' && (
                <UserManagement users={users} setUsers={setUsers} />
              )}

              {/* TAB: SETTINGS */}
              {activeTab === 'settings' && (
                <div className="max-w-2xl mx-auto glass-panel p-8 rounded-2xl space-y-6">
                  <div>
                    <h3 className="text-base font-bold text-white flex items-center gap-2">
                      <Icon name="settings" size={18} className="text-brand" />
                      Cấu Hình Hệ Thống Video
                    </h3>
                    <p className="text-xs text-gray-400 mt-1">Cấu hình mã API kết nối, máy chủ mặc định và thiết lập lưu trữ đệm.</p>
                  </div>

                  <form onSubmit={handleSaveSettings} className="space-y-5">
                    <div className="space-y-2">
                      <label className="text-xs font-bold text-white block">Mã khóa API TMDB (v3 authentication)</label>
                      <input
                        type="text"
                        value={apiKey}
                        onChange={(e) => setApiKey(e.target.value)}
                        className="w-full bg-[#0a0a0c] border border-[#1f1f2e] rounded-xl text-xs text-white px-4 py-2.5 outline-none focus:border-brand transition-colors font-mono"
                        required
                      />
                    </div>

                    <div className="space-y-2">
                      <label className="text-xs font-bold text-white block">Server Player Mặc Định</label>
                      <select
                        value={serverDefault}
                        onChange={(e) => setServerDefault(e.target.value)}
                        className="w-full bg-[#0a0a0c] border border-[#1f1f2e] rounded-xl text-xs text-white px-4 py-2.5 outline-none focus:border-brand transition-colors"
                      >
                        <option value="vidsrc.pro">Server 1 (Vidsrc.pro)</option>
                        <option value="vidsrc.me">Server 2 (Vidsrc.me)</option>
                        <option value="2embed.org">Server 3 (2Embed.org)</option>
                      </select>
                    </div>

                    <div className="space-y-2">
                      <label className="text-xs font-bold text-white block">Thời Gian Lưu Bộ Nhớ Đệm (Giờ)</label>
                      <input
                        type="number"
                        value={cacheExpiry}
                        onChange={(e) => setCacheExpiry(e.target.value)}
                        className="w-full bg-[#0a0a0c] border border-[#1f1f2e] rounded-xl text-xs text-white px-4 py-2.5 outline-none focus:border-brand transition-colors font-mono"
                        min="1"
                        max="168"
                        required
                      />
                    </div>

                    <div className="flex items-center justify-between bg-[#121216]/50 border border-[#1f1f2e] p-4 rounded-xl">
                      <div>
                        <h5 className="text-xs font-bold text-white">Chế độ bảo trì hệ thống</h5>
                        <p className="text-[10px] text-gray-400 mt-0.5">Tự động khóa truy cập đối với các tài khoản người dùng bình thường.</p>
                      </div>
                      <label className="relative inline-flex items-center cursor-pointer">
                        <input 
                          type="checkbox" 
                          checked={maintenanceMode}
                          onChange={(e) => setMaintenanceMode(e.target.checked)}
                          className="sr-only peer"
                        />
                        <div className="w-11 h-6 bg-[#0a0a0c] border border-[#1f1f2e] rounded-full peer peer-focus:ring-0 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-gray-400 after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand"></div>
                      </label>
                    </div>

                    <div className="flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-[#1f1f2e]/40">
                      <button
                        type="button"
                        onClick={() => alert("Đã dọn dẹp dữ liệu đệm phim thành công!")}
                        className="flex items-center gap-1.5 bg-dark-bg hover:bg-dark-border border border-[#1f1f2e] px-4 py-2 rounded-xl text-xs font-bold transition-all"
                      >
                        <Icon name="rotate-ccw" size={14} /> Clear Cache
                      </button>
                      <button
                        type="submit"
                        className="flex items-center gap-1.5 bg-brand hover:bg-brand-dark px-5 py-2.5 rounded-xl text-xs font-bold text-white transition-all shadow-lg shadow-brand/10 glow-red"
                      >
                        <Icon name="save" size={14} /> Lưu cấu hình
                      </button>
                    </div>
                  </form>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
